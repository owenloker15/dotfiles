-- #######################################################################################
-- Hyprland 0.56.x configuration
-- Converted from the old hyprland.conf format
-- #######################################################################################

local mocha = require("mocha")

-- -----------------------------------------------------------------------------
-- Startup
-- -----------------------------------------------------------------------------

hl.on("hyprland.start", function()
	hl.exec_cmd("hyprctl setcursor catppuccin-mocha-dark-cursors 28")
	hl.exec_cmd("/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1")
	hl.exec_cmd("waybar & swaync & hyprpaper & hypridle")
end)

-- -----------------------------------------------------------------------------
-- Monitors
-- -----------------------------------------------------------------------------

hl.monitor({
	output = "DP-3",
	mode = "1920x1080",
	position = "0x0",
	scale = 1,
})

hl.monitor({
	output = "DP-2",
	mode = "2560x1440",
	position = "1920x0",
	scale = 1,
})

-- -----------------------------------------------------------------------------
-- Programs
-- -----------------------------------------------------------------------------

local terminal = "ghostty"
local fileManager = "nautilus"
local menu = "wofi --show drun"

-- -----------------------------------------------------------------------------
-- Environment
-- -----------------------------------------------------------------------------

hl.env("XCURSOR_SIZE", "24")
hl.env("QT_QPA_PLATFORMTHEME", "qt5ct")

-- -----------------------------------------------------------------------------
-- XWayland
-- -----------------------------------------------------------------------------

hl.config({
	xwayland = {
		force_zero_scaling = true,
	},
})

-- -----------------------------------------------------------------------------
-- Input
-- -----------------------------------------------------------------------------

hl.config({
	input = {
		kb_layout = "us",
		kb_variant = "",
		kb_model = "",
		kb_options = "ctrl:nocaps",
		kb_rules = "",

		follow_mouse = 1,
		sensitivity = 0,

		touchpad = {
			natural_scroll = true,
		},
	},
})

-- -----------------------------------------------------------------------------
-- General
-- -----------------------------------------------------------------------------

hl.config({
	general = {
		border_size = 3,

        col = {
            active_border = {
                colors = {
                    mocha.mauve,
                    mocha.flamingo,
                },
                angle = 90,
            },

            inactive_border = mocha.subtext0,
        },

		resize_on_border = true,

		gaps_in = 4,
		gaps_out = 8,

		layout = "dwindle",

		allow_tearing = false,
	},
})

-- -----------------------------------------------------------------------------
-- Decoration
-- -----------------------------------------------------------------------------

hl.config({
	decoration = {
		rounding = 4,

		blur = {
			enabled = true,
			size = 3,
			passes = 1,
		},

		shadow = {
			enabled = true,
			range = 4,
			render_power = 3,
			color = "rgba(1a1a1aee)",
		},
	},
})

-- -----------------------------------------------------------------------------
-- Dwindle
-- -----------------------------------------------------------------------------

hl.config({
	dwindle = {
		preserve_split = true,
	},
})

-- -----------------------------------------------------------------------------
-- Animations
-- -----------------------------------------------------------------------------

hl.config({
	animations = {
		enabled = true,
	},
})

hl.curve("linear", {
    type = "bezier",
    points = {
        { 0.0, 0.0 },
        { 1.0, 1.0 },
    },
})

hl.animation({
	leaf = "borderangle",
	enabled = true,
	speed = 50,
	bezier = "linear",
	style = "loop",
})

hl.animation({
	leaf = "workspaces",
	enabled = true,
	speed = 1,
	bezier = "default",
})

hl.animation({
	leaf = "windows",
	enabled = true,
	speed = 1,
	bezier = "default",
})

hl.animation({
	leaf = "fade",
	enabled = true,
	speed = 1,
	bezier = "default",
})

-- -----------------------------------------------------------------------------
-- Gestures
-- -----------------------------------------------------------------------------

-- Nothing enabled in original config.

-- -----------------------------------------------------------------------------
-- Misc
-- -----------------------------------------------------------------------------

hl.config({
	misc = {
		force_default_wallpaper = 0,
	},
})

-- -----------------------------------------------------------------------------
-- Device
-- -----------------------------------------------------------------------------

hl.config({
	device = {
		-- Original device-specific setting:
		-- name = "epic-mouse-v1"
		--
		-- Device-specific configuration is handled separately in 0.56.
	},
})

-- -----------------------------------------------------------------------------
-- Window rules
-- -----------------------------------------------------------------------------

hl.window_rule({
	match = {
		class = ".*",
	},
	suppress_event = "maximize",
})

-- Wofi layer rule
hl.layer_rule({
	match = {
		namespace = "wofi",
	},
	no_anim = true,
})

-- -----------------------------------------------------------------------------
-- Keybinds
-- -----------------------------------------------------------------------------

local mainMod = "SUPER"

-- Sound
hl.bind("XF86AudioRaiseVolume", hl.dsp.exec_cmd("pactl set-sink-volume @DEFAULT_SINK@ +10%"))

hl.bind("XF86AudioLowerVolume", hl.dsp.exec_cmd("pactl set-sink-volume @DEFAULT_SINK@ -10%"))

hl.bind("XF86AudioMute", hl.dsp.exec_cmd("pactl set-sink-mute @DEFAULT_SINK@ toggle"))

-- Brightness
hl.bind("XF86MonBrightnessUp", hl.dsp.exec_cmd("brightnessctl set +5%"))

hl.bind("XF86MonBrightnessDown", hl.dsp.exec_cmd("brightnessctl set 5%-"))

-- Applications
hl.bind(mainMod .. " + RETURN", hl.dsp.exec_cmd(terminal))

hl.bind(mainMod .. " + C", hl.dsp.window.kill())

hl.bind(mainMod .. " + M", hl.dsp.exit())

hl.bind(mainMod .. " + V", hl.dsp.window.float({ action = "toggle" }))

hl.bind(mainMod .. " + SPACE", hl.dsp.exec_cmd(menu))

hl.bind(mainMod .. " + SHIFT + B", hl.dsp.exec_cmd("hyprlock"))

hl.bind(mainMod .. " + SHIFT + R", hl.dsp.exec_cmd("hyprctl reload"))

-- Dwindle
hl.bind(mainMod .. " + P", hl.dsp.window.pseudo())

hl.bind(mainMod .. " + E", hl.dsp.layout("togglesplit"))

hl.bind(mainMod .. " + F", hl.dsp.window.fullscreen())

hl.bind(mainMod .. " + W", hl.dsp.group.toggle())

-- -----------------------------------------------------------------------------
-- Focus
-- -----------------------------------------------------------------------------

hl.bind(mainMod .. " + H", hl.dsp.focus({ direction = "left" }))
hl.bind(mainMod .. " + L", hl.dsp.focus({ direction = "right" }))
hl.bind(mainMod .. " + K", hl.dsp.focus({ direction = "up" }))
hl.bind(mainMod .. " + J", hl.dsp.focus({ direction = "down" }))

-- -----------------------------------------------------------------------------
-- Move windows
-- -----------------------------------------------------------------------------

hl.bind(mainMod .. " + SHIFT + H", hl.dsp.window.move({ direction = "left" }))
hl.bind(mainMod .. " + SHIFT + L", hl.dsp.window.move({ direction = "right" }))

-- -----------------------------------------------------------------------------
-- Workspaces
-- -----------------------------------------------------------------------------

hl.bind(mainMod .. " + 1", hl.dsp.focus({ workspace = "1" }))
hl.bind(mainMod .. " + 2", hl.dsp.focus({ workspace = "2" }))
hl.bind(mainMod .. " + 3", hl.dsp.focus({ workspace = "3" }))
hl.bind(mainMod .. " + 4", hl.dsp.focus({ workspace = "4" }))
hl.bind(mainMod .. " + 5", hl.dsp.focus({ workspace = "5" }))
hl.bind(mainMod .. " + 6", hl.dsp.focus({ workspace = "6" }))
hl.bind(mainMod .. " + 7", hl.dsp.focus({ workspace = "7" }))
hl.bind(mainMod .. " + 8", hl.dsp.focus({ workspace = "8" }))
hl.bind(mainMod .. " + 9", hl.dsp.focus({ workspace = "9" }))
hl.bind(mainMod .. " + 0", hl.dsp.focus({ workspace = "10" }))

-- -----------------------------------------------------------------------------
-- Move windows to workspaces
-- -----------------------------------------------------------------------------

hl.bind(mainMod .. " + SHIFT + 1",
    hl.dsp.window.move({ workspace = "1" }))

hl.bind(mainMod .. " + SHIFT + 2",
    hl.dsp.window.move({ workspace = "2" }))

hl.bind(mainMod .. " + SHIFT + 3",
    hl.dsp.window.move({ workspace = "3" }))

hl.bind(mainMod .. " + SHIFT + 4",
    hl.dsp.window.move({ workspace = "4" }))

hl.bind(mainMod .. " + SHIFT + 5",
    hl.dsp.window.move({ workspace = "5" }))

hl.bind(mainMod .. " + SHIFT + 6",
    hl.dsp.window.move({ workspace = "6" }))

hl.bind(mainMod .. " + SHIFT + 7",
    hl.dsp.window.move({ workspace = "7" }))

hl.bind(mainMod .. " + SHIFT + 8",
    hl.dsp.window.move({ workspace = "8" }))

hl.bind(mainMod .. " + SHIFT + 9",
    hl.dsp.window.move({ workspace = "9" }))

hl.bind(mainMod .. " + SHIFT + 0",
    hl.dsp.window.move({ workspace = "10" }))

-- -----------------------------------------------------------------------------
-- Special workspace / scratchpad
-- -----------------------------------------------------------------------------

hl.bind(
    mainMod .. " + S",
    hl.dsp.workspace.toggle_special("magic")
)

hl.bind(
    mainMod .. " + SHIFT + S",
    hl.dsp.window.move({ workspace = "special:magic" })
)

-- -----------------------------------------------------------------------------
-- Workspace scrolling
-- -----------------------------------------------------------------------------

hl.bind(
    mainMod .. " + mouse_down",
    hl.dsp.focus({ workspace = "e+1" })
)

hl.bind(
    mainMod .. " + mouse_up",
    hl.dsp.focus({ workspace = "e-1" })
)

-- -----------------------------------------------------------------------------
-- Mouse binds
-- -----------------------------------------------------------------------------

hl.bind(
    mainMod .. " + mouse:272",
    hl.dsp.window.drag(),
    { mouse = true }
)

hl.bind(
    mainMod .. " + mouse:273",
    hl.dsp.window.resize(),
    { mouse = true }
)
